name: Build GeoSnap Android App

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure package.json exists
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "geosnap", "version": "1.0.0", "private": true}' > package.json
          fi

      - name: Install Capacitor Dependencies
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Config
        run: |
          npx cap init GeoSnap com.geosnap.app --web-dir . --yes || true

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geosnap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
