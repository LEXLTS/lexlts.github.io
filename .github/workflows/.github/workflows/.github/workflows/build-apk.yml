name: Build GeoSnap Android App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create package.json if missing
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "geosnap", "version": "1.0.0", "private": true}' > package.json
          fi

      - name: Install Capacitor Core & Android Platform
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor Configuration
        run: |
          npx cap init GeoSnap com.geosnap.app --web-dir . --yes || true

      - name: Add Android Platform & Sync Web Assets
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Executable Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geosnap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
