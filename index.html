<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoSnap</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <style>
        :root {
            --primary: #007bff;
            --bg-dark: #222;
            --text-light: #fff;
            --bottom-bar-height: 80px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-light);
        }

        /* --- Global Layout Containers --- */
        #app-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Standard Camera Preview */
        #camera-feed {
            flex: 1;
            background-color: #333; /* Placeholder */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Lock aspect ratio within preview (16:9 example) */
        #aspect-ratio-frame {
            aspect-ratio: 16 / 9;
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            background-color: #000;
        }

        /* Standard Bottom Control Bar (Fixed) */
        #bottom-control-bar {
            height: var(--bottom-bar-height);
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .capture-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--text-light);
            border: 5px solid #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            cursor: pointer;
        }

        /* --- STATE 1: Startup Configuration --- */
        #startup-config-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - var(--bottom-bar-height));
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #startup-config-overlay.hidden {
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        .config-modal {
            background-color: #fff;
            color: #000;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .config-modal h2 { text-align: center; margin-top: 0; }
        .config-modal label { display: block; margin: 10px 0 5px; font-weight: bold; }
        .config-modal input, .config-modal select, .config-modal textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        
        #start-camera-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* --- STATE 2: Live Camera with 3-Dot Menu --- */
        #live-controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* Let clicks pass through to standard elements below */
            display: none;
        }

        #live-controls-overlay.active { display: block; }

        /* --- Fixed Gesture Sliders (Always Visible but pass clicks) --- */
        /* ZOOM (Vertical, Right) */
        .zoom-slider-container {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            width: 40px;
            height: 200px;
            pointer-events: auto; /* Buttons are clickable */
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            color: #fff;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
        }

        /* BRIGHTNESS (Horizontal, Bottom) */
        .brightness-slider-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 30px;
            pointer-events: auto;
            color: #fff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }

        /* --- 3-Dot Menu Handling --- */
        #top-controls {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            pointer-events: auto; /* Title and menu are clickable */
            background-color: var(--bg-dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #top-controls h3 { margin: 0; }

        #menu-dots {
            font-size: 28px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #menu-dots span {
            width: 5px; height: 5px;
            background-color: var(--text-light);
            border-radius: 50%;
            transition: background 0.3s;
        }
        #menu-dots.active span { background-color: var(--primary); }

        /* The actual side menu (hidden by default) */
        #side-menu {
            position: absolute;
            top: 60px;
            right: 0;
            width: 250px;
            height: calc(100% - var(--bottom-bar-height) - 60px);
            background-color: var(--bg-dark);
            border-left: 2px solid #444;
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            pointer-events: auto;
            transform: translateX(100%);
            transition: transform 0.3s ease-out;
            overflow-y: auto;
        }

        #side-menu.open { transform: translateX(0); }

        #side-menu h3 {
            color: var(--primary);
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            margin-top: 20px;
        }
        #side-menu h3:first-child { margin-top: 0; }

        #side-menu ul { list-style: none; padding: 0; margin: 0; }
        #side-menu li {
            padding: 12px 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }
        #side-menu li:hover { background-color: #333; }

        /* Utility classes */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app-wrapper">

        <!-- --- GLOBAL: Camera Feed Area --- -->
        <div id="camera-feed">
            <!-- Frame locking the specific aspect ratio inside the preview -->
            <div id="aspect-ratio-frame">
                <!-- Camera data will render here -->
                <div style="color:#555; text-align:center; padding-top:20%;">Camera Preview</div>
            </div>
        </div>

        <!-- --- STATE 1: Startup Config Overlay --- -->
        <div id="startup-config-overlay">
            <div class="config-modal">
                <h2>CONFIGURE GEOSNAP</h2>
                
                <label>Select Sector:</label>
                <select id="sector-select">
                    <option value="construction">Construction Field</option>
                    <option value="it">IT Field</option>
                    <option value="cleaning">Cleaning Field</option>
                    <option value="food">Food Field</option>
                </select>

                <label>Project / Code:</label>
                <input type="text" id="project-code" value="GS-2026-IT-01">

                <label>Zone / Site:</label>
                <input type="text" id="zone-input" value="Singapore HO">

                <label>Ongoing Activities:</label>
                <textarea id="activities-input">System Maintenance</textarea>
                
                <button id="start-camera-btn">START CAMERA</button>
            </div>
        </div>

        <!-- --- STATE 2: Live Controls & 3-Dot Menu --- -->
        <div id="live-controls-overlay">
            
            <!-- Top Controls Fixed -->
            <div id="top-controls">
                <h3>GEOSNAP</h3>
                <div id="menu-dots" onclick="toggleMenu()">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Lock standard gesture sliders on live view -->
            <div class="zoom-slider-container">
                <div>+</div>
                <div style="font-size:12px;">ZOOM</div>
                <div>-</div>
            </div>

            <div class="brightness-slider-container">
                <div>*</div>
                <div style="font-size:12px;">BRIGHTNESS (Hiz)</div>
                <div>*</div>
            </div>

            <!-- Slide-out Menu -->
            <div id="side-menu">
                <h3>SECTORS</h3>
                <ul id="sector-menu-list">
                    <li>Construction</li>
                    <li>IT Field</li>
                    <li>Cleaning</li>
                    <li>Food Field</li>
                </ul>

                <h3>IMAGE OPTIONS</h3>
                <ul>
                    <li>Grid View</li>
                    <li>Print</li>
                    <li>Delete</li>
                    <li>Info 'i'</li>
                    <li>Custom Filenames</li>
                </ul>

                <h3>CONTROLS</h3>
                <ul>
                    <li>Zoom (+/-)</li>
                    <li>Settings</li>
                </ul>
            </div>
        </div>

        <!-- --- GLOBAL: Bottom Bar Fixed --- -->
        <div id="bottom-control-bar">
            <div class="capture-btn" id="capture-button"></div>
        </div>

    </div>

    <script>
        // --- Screen Management Logic ---
        const startupOverlay = document.getElementById('startup-config-overlay');
        const liveOverlay = document.getElementById('live-controls-overlay');
        const startBtn = document.getElementById('start-camera-btn');
        const captureBtn = document.getElementById('capture-button');
        
        // Start App and Switch Screens
        startBtn.addEventListener('click', function() {
            startupOverlay.classList.add('hidden');
            liveOverlay.classList.add('active');
            
            // Re-use current GeoSnap filename logic here
            alert("Camera started with config: " + document.getElementById('project-code').value);
        });

        // Capture Button action (Placeholder)
        captureBtn.addEventListener('click', function() {
            if (liveOverlay.classList.contains('active')) {
                // Implement timestamp filename logic here
                alert("Photo Captured! Saving...");
            }
        });

        // --- 3-Dot Menu Logic ---
        const menuDots = document.getElementById('menu-dots');
        const sideMenu = document.getElementById('side-menu');

        function toggleMenu() {
            const isOpen = sideMenu.classList.contains('open');
            
            if (!isOpen) {
                // Open the menu
                sideMenu.classList.add('open');
                menuDots.classList.add('active');
                
                // Add click listener to document to close if clicking outside
                setTimeout(() => {
                    document.addEventListener('click', closeMenuOutside);
                }, 0);
                
            } else {
                // Close the menu
                closeMenu();
            }
        }

        function closeMenuOutside(event) {
            // Close if clicking outside the side menu and not on the dots icon
            if (!sideMenu.contains(event.target) && !menuDots.contains(event.target)) {
                closeMenu();
            }
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            menuDots.classList.remove('active');
            document.removeEventListener('click', closeMenuOutside);
        }

        // --- Sector Selection Logic ---
        const sectorList = document.getElementById('sector-menu-list');
        const mainSectorDropdown = document.getElementById('sector-select');

        // Link menu selections back to the main dropdown (for logic continuity)
        sectorList.addEventListener('click', function(e) {
            if (e.target && e.target.nodeName === "LI") {
                const sectorName = e.target.innerText;
                const normalizedSector = sectorName.toLowerCase().replace(/\s+/g, '-');

                // Map the clicked name to the value of the main dropdown
                for (let option of mainSectorDropdown.options) {
                    if (option.value.includes(normalizedSector) || normalizedSector.includes(option.value)) {
                        mainSectorDropdown.value = option.value;
                        break;
                    }
                }

                alert("Sector changed to: " + sectorName);
                closeMenu();
            }
        });

        // Handle Orientation Change to reposition sliders if needed (conceptual)
        window.addEventListener('orientationchange', function() {
            // Screen orientation is locked in PWA TWA usually, but logic would go here.
            // Conceptual rotation of brightness label logic would fire here.
        });
    </script>
</body>
</html>
