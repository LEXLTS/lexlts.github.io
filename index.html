<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoSnap</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #app-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }

        /* Camera & Live Feed */
        #camera-feed-container {
            flex: 1; position: relative; background-color: #000;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        #webcam-video { width: 100%; height: 100%; object-fit: cover; }
        #watermark-canvas { display: none; }

        /* Top Bar */
        #top-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 55px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            z-index: 30; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        #top-controls h3 { margin: 0; font-size: 16px; letter-spacing: 1px; }
        #menu-dots {
            width: 35px; height: 35px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 4px; cursor: pointer;
            background: rgba(0,0,0,0.5); border-radius: 50%;
        }
        #menu-dots span { width: 4px; height: 4px; background-color: #fff; border-radius: 50%; }

        /* Side Settings Menu */
        #side-menu {
            position: absolute; top: 55px; right: 0; width: 280px;
            height: calc(100% - 55px - 90px); background-color: rgba(15, 15, 15, 0.96);
            backdrop-filter: blur(12px); border-left: 1px solid #333; padding: 15px;
            z-index: 40; transform: translateX(100%); transition: transform 0.3s ease-in-out;
            overflow-y: auto; font-size: 13px;
        }
        #side-menu.open { transform: translateX(0); }
        #side-menu h4 { color: #007bff; margin: 12px 0 6px 0; border-bottom: 1px solid #333; padding-bottom: 3px; }
        #side-menu label { display: block; margin: 6px 0 2px; color: #aaa; }
        #side-menu input, #side-menu select, #side-menu textarea {
            width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 13px;
        }
        #side-menu textarea { height: 50px; resize: none; }

        /* Bottom Controls */
        #bottom-control-bar {
            height: 90px; background-color: #111; display: flex;
            justify-content: space-around; align-items: center; z-index: 10; flex-shrink: 0; padding: 0 20px;
        }
        .capture-btn {
            width: 65px; height: 65px; border-radius: 50%; background-color: #fff;
            border: 5px solid #444; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .nav-icon-btn {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            padding: 10px 15px; border-radius: 8px; font-size: 13px; cursor: pointer;
        }

        /* Gestures: Zoom & Brightness Sliders */
        .zoom-slider-container {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.6); padding: 10px 6px; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 20;
        }
        .zoom-slider-container input[type=range] {
            writing-mode: vertical-lr; direction: rtl; height: 120px; accent-color: #007bff; cursor: pointer;
        }

        .brightness-container {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 6px 15px; border-radius: 15px;
            display: flex; align-items: center; gap: 10px; z-index: 20; width: 200px;
        }
        .brightness-container input[type=range] { width: 100%; accent-color: #ffc107; cursor: pointer; }

        /* Preview Modal */
        #preview-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95); z-index: 150; display: none; flex-direction: column; padding: 20px;
        }
        #preview-modal.active { display: flex; }
        .gallery-grid { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; overflow-y: auto; padding-top: 15px; }
        .gallery-item { background: #222; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #444; }
        .gallery-item img { width: 100%; height: 120px; object-fit: cover; }
        .gallery-actions { display: flex; justify-content: space-around; padding: 8px; background: #151515; }
        .gallery-actions button { background: none; border: none; color: #007bff; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="app-wrapper">

        <!-- Top Header -->
        <div id="top-controls">
            <h3 id="display-title">GEOSNAP | Construction</h3>
            <div id="menu-dots" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Camera Stream & Gestures -->
        <div id="camera-feed-container">
            <video id="webcam-video" autoplay playsinline muted></video>
            <canvas id="watermark-canvas"></canvas>

            <!-- Vertical Zoom Slider -->
            <div class="zoom-slider-container">
                <span style="font-size:10px;">+</span>
                <input type="range" id="zoom-range" min="1" max="3" step="0.1" value="1" oninput="adjustZoom(this.value)">
                <span style="font-size:10px;">-</span>
            </div>

            <!-- Horizontal Brightness Slider -->
            <div class="brightness-container">
                <span>☀️</span>
                <input type="range" id="brightness-range" min="50" max="150" value="100" oninput="adjustBrightness(this.value)">
            </div>
        </div>

        <!-- Side Menu (Optional Metadata & Sectors) -->
        <div id="side-menu">
            <h4>Select Sector</h4>
            <select id="sector-select" onchange="updateSectorTitle()">
                <option value="Construction">Construction Field</option>
                <option value="IT">IT Field</option>
                <option value="Cleaning">Cleaning Field</option>
                <option value="Food">Food Field</option>
            </select>

            <h4>Project Details</h4>
            <label>Project Code:</label>
            <input type="text" id="project-code" value="GS-2026-001">
            
            <label>Zone / Location:</label>
            <input type="text" id="zone-input" value="Site Alpha (Sg)">

            <label>Site In Charge:</label>
            <input type="text" id="manager-input" value="Manager Name">

            <label>Activities:</label>
            <textarea id="activities-input">General Site Work</textarea>
        </div>

        <!-- Preview Modal Gallery -->
        <div id="preview-modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0;">Captured Gallery</h3>
                <button onclick="closePreviewGallery()" style="background:#ff4444; border:none; color:#fff; padding:6px 12px; border-radius:5px;">Close</button>
            </div>
            <div class="gallery-grid" id="gallery-container"></div>
        </div>

        <!-- Bottom Controls -->
        <div id="bottom-control-bar">
            <button class="nav-icon-btn" onclick="openPreviewGallery()">PREVIEW</button>
            <div class="capture-btn" id="capture-button" onclick="capturePhotoWithWatermark()"></div>
            <button class="nav-icon-btn" onclick="toggleMenu()">INFO i</button>
        </div>

    </div>

    <script>
        const videoElement = document.getElementById('webcam-video');
        let capturedMediaArray = [];
        let videoTrack = null;

        // Initialize Camera Immediately
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, audio: false
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }));
                videoElement.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
            } catch (err) {
                alert("Camera error: " + err.message);
            }
        }
        initCamera();

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
        }

        function updateSectorTitle() {
            const sector = document.getElementById('sector-select').value;
            document.getElementById('display-title').innerText = "GEOSNAP | " + sector;
        }

        // Zoom Control
        function adjustZoom(val) {
            if (videoTrack && videoTrack.getCapabilities().zoom) {
                videoTrack.applyConstraints({ advanced: [{ zoom: val }] });
            } else {
                videoElement.style.transform = `scale(${val})`;
            }
        }

        // Brightness Control
        function adjustBrightness(val) {
            videoElement.style.filter = `brightness(${val}%)`;
        }

        // Capture Photo with Timestamp & Custom Metadata Watermark
        function capturePhotoWithWatermark() {
            const canvas = document.getElementById('watermark-canvas');
            canvas.width = videoElement.videoWidth || 1280;
            canvas.height = videoElement.videoHeight || 720;
            const ctx = canvas.getContext('2d');

            // Draw video frame
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            // Get metadata values
            const sector = document.getElementById('sector-select').value;
            const code = document.getElementById('project-code').value;
            const zone = document.getElementById('zone-input').value;
            const manager = document.getElementById('manager-input').value;
            const activities = document.getElementById('activities-input').value;
            const now = new Date();
            const timeStr = now.toLocaleString();
            const fileName = `${code}_${now.toISOString().replace(/[:.]/g, '-')}.jpg`;

            // Draw Watermark Overlay Box at bottom
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(20, canvas.height - 180, canvas.width - 40, 160);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText(`GEOSNAP [${sector.toUpperCase()}] - ${code}`, 40, canvas.height - 140);

            ctx.font = '16px sans-serif';
            ctx.fillText(`📍 Zone: ${zone} | ⏱️ ${timeStr}`, 40, canvas.height - 110);
            ctx.fillText(`👤 In Charge: ${manager}`, 40, canvas.height - 80);
            ctx.fillText(`📝 Activities: ${activities}`, 40, canvas.height - 50);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

            // Save directly to local gallery storage array & auto download silently
            capturedMediaArray.unshift({ name: fileName, data: dataUrl });

            const link = document.createElement('a');
            link.download = fileName;
            link.href = dataUrl;
            link.click();
        }

        function openPreviewGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            if (capturedMediaArray.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#777;">No photos captured yet.</p>';
            } else {
                capturedMediaArray.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.innerHTML = `
                        <img src="${item.data}">
                        <div style="padding: 5px; font-size: 11px; color: #ccc;">${item.name}</div>
                        <div class="gallery-actions">
                            <button onclick="alert('Shared successfully!')">Share</button>
                            <button onclick="capturedMediaArray.splice(${index},1); openPreviewGallery();" style="color:#ff4444;">Delete</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
            document.getElementById('preview-modal').classList.add('active');
            document.getElementById('side-menu').classList.remove('open');
        }

        function closePreviewGallery() {
            document.getElementById('preview-modal').classList.remove('active');
        }
    </script>
</body>
</html>
