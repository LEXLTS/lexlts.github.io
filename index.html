<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoSnap</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #app-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }

        /* Camera Feed & Gestures */
        #camera-feed-container {
            flex: 1; position: relative; background-color: #000;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        #webcam-video { width: 100%; height: 100%; object-fit: cover; }
        #watermark-canvas { display: none; }

        /* Zoom Slider (Vertical - Right) */
        .zoom-slider-container {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.6); padding: 10px 6px; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 25;
        }
        .zoom-slider-container input[type=range] {
            writing-mode: vertical-lr; direction: rtl; height: 120px; accent-color: #007bff; cursor: pointer;
        }

        /* Brightness Slider (Horizontal - Bottom above controls) */
        .brightness-container {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 6px 15px; border-radius: 15px;
            display: flex; align-items: center; gap: 10px; z-index: 25; width: 200px;
        }
        .brightness-container input[type=range] { width: 100%; accent-color: #ffc107; cursor: pointer; }

        /* Top Bar */
        #top-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
            z-index: 30; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .top-btn, #menu-dots {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
        }
        #menu-dots { display: flex; flex-direction: column; gap: 3px; justify-content: center; align-items: center; width: 36px; height: 36px; padding: 0; }
        #menu-dots span { width: 4px; height: 4px; background-color: #fff; border-radius: 50%; }

        /* Side Settings Menu */
        #side-menu {
            position: absolute; top: 60px; right: 0; width: 300px;
            height: calc(100% - 60px - 90px); background-color: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(12px); border-left: 1px solid #333; padding: 15px;
            z-index: 40; transform: translateX(100%); transition: transform 0.3s ease-in-out;
            overflow-y: auto; font-size: 13px;
        }
        #side-menu.open { transform: translateX(0); }
        #side-menu h4 { color: #007bff; margin: 15px 0 8px 0; border-bottom: 1px solid #333; padding-bottom: 4px; }
        #side-menu label { display: block; margin: 8px 0 2px; color: #aaa; }
        #side-menu input, #side-menu select, #side-menu textarea {
            width: 100%; padding: 7px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 12px;
        }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; color: #ddd; cursor: pointer; }
        .checkbox-group input { width: 16px; height: 16px; accent-color: #007bff; cursor: pointer; }

        /* Bottom Controls */
        #bottom-control-bar {
            height: 90px; background-color: #111; display: flex;
            justify-content: space-around; align-items: center; z-index: 10; flex-shrink: 0; padding: 0 10px;
        }
        .bottom-icon-btn {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            padding: 8px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; text-align: center;
        }
        .bottom-icon-btn.active { background: #007bff; }
        .capture-btn {
            width: 65px; height: 65px; border-radius: 50%; background-color: #fff;
            border: 5px solid #444; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Preview Modal */
        #preview-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95); z-index: 150; display: none; flex-direction: column; padding: 20px;
        }
        #preview-modal.active { display: flex; }
        .gallery-grid { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; overflow-y: auto; padding-top: 15px; }
        .gallery-item { background: #222; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #444; }
        .gallery-item img { width: 100%; height: 120px; object-fit: cover; }
        .gallery-actions { display: flex; justify-content: space-around; padding: 8px; background: #151515; }
        .gallery-actions button { background: none; border: none; color: #007bff; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="app-wrapper">

        <!-- Top Controls: Flash, Preview, 3-Dot Menu -->
        <div id="top-controls">
            <button class="top-btn" id="flash-btn" onclick="toggleFlash()">⚡ Flash: OFF</button>
            <button class="top-btn" onclick="openPreviewGallery()">📁 Preview</button>
            <div id="menu-dots" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Camera Feed & Interactive Sliders -->
        <div id="camera-feed-container">
            <video id="webcam-video" autoplay playsinline muted></video>

            <div class="zoom-slider-container">
